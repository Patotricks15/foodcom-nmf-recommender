# Feature specification for foodcom-nmf-recommender.
#
# Every feature the pipeline materializes is declared here. The registry
# check in `recommender.features.registry` asserts this file and the
# implementation agree in BOTH directions, so a transform cannot be computed
# without being declared, and a declaration cannot go unimplemented.
#
# Fields
#   family        One of the nine families in the portfolio standard.
#   fit_on        train_only -> reads interactions, restricted to the
#                 training partition.
#                 catalogue  -> reads recipe metadata only; no label signal.
#   point_in_time Whether the value depends on *when* it is computed. Such
#                 features receive an explicit `as_of` cut-off and are
#                 covered by tests/test_features_leakage.py.
#   fill          Value substituted for entities absent at serving time.
#   rationale     Why the feature exists. Required; a feature nobody can
#                 justify is a feature nobody can debug.

version: 1
dataset: foodcom

features:
  - name: user_activity_count
    family: user
    dtype: float64
    transform: user_activity_count
    fit_on: train_only
    point_in_time: false
    params:
      log_transform: true
    fill:
      unknown_user: 0.0
    rationale: >
      Review volume separates a user with enough history for collaborative
      signal from one riding on the popularity prior. The distribution is
      heavy-tailed, so it is log-compressed before NMF's input matrix or any
      downstream linear model consumes it.

  - name: user_mean_rating
    family: user
    dtype: float64
    transform: user_mean_rating
    fit_on: train_only
    point_in_time: false
    params: {}
    fill:
      unknown_user: global_rating_mean
    rationale: >
      Implicit filtering keeps only positives, so this measures how
      generously a user rates recipes they already liked. It calibrates the
      confidence attached to a positive rather than the positive itself.

  - name: user_tenure_days
    family: user
    dtype: float64
    transform: user_tenure_days
    fit_on: train_only
    point_in_time: false
    params: {}
    fill:
      unknown_user: 0.0
    rationale: >
      Calendar span between a user's first and last training review.
      Distinguishes fifty reviews spread over three years from fifty reviews
      in one weekend; the two imply very different taste stability.

  - name: user_recency_days
    family: context
    dtype: float64
    transform: user_recency_days
    fit_on: train_only
    point_in_time: true
    params: {}
    fill:
      unknown_user: 0.0
    rationale: >
      Days from a user's last training review to the cut-off. A dormant
      user's stored preferences are staler than an active user's, and the
      serving path should weigh them accordingly. Depends on the cut-off, so
      it is recomputed per partition and never cached across splits.

  - name: item_popularity_rank
    family: item
    dtype: float64
    transform: item_popularity_rank
    fit_on: train_only
    point_in_time: false
    params:
      normalize: true
    fill:
      unknown_item: 1.0
    rationale: >
      Normalized dense popularity rank over the full recipe catalogue. Backs
      the popularity baseline and the cold-start fallback. Total over the
      catalogue by construction, so serving never hits a missing key.

  - name: item_trailing_popularity
    family: statistical
    dtype: float64
    transform: item_trailing_popularity
    fit_on: train_only
    point_in_time: true
    params:
      window_days: 90.0
      log_transform: true
    fill:
      unknown_item: 0.0
    rationale: >
      Review count in the 90 days before the cut-off. Lifetime popularity is
      dominated by whatever recipe went viral years ago; a trailing window
      tracks what is popular now, which is what a system serving traffic at
      the cut-off actually needs. This is the feature that justifies
      evaluating on a temporal split.

  - name: item_category_tokens
    family: text
    dtype: object
    transform: item_category_tokens
    fit_on: catalogue
    point_in_time: false
    params: {}
    fill:
      unknown_item: ""
    rationale: >
      Recipe category label (Dessert, Main Dish, Salad, ...). Content signal
      available for recipes with no interactions at all, which is the only
      thing a purely collaborative model cannot supply for a cold recipe.

  - name: item_calories
    family: item
    dtype: float64
    transform: item_calories
    fit_on: catalogue
    point_in_time: false
    params:
      fallback: 0.0
    fill:
      unknown_item: 0.0
    rationale: >
      Calories per serving, passed through from the recipe catalogue. Feeds
      the nutrition-aware post-filter directly rather than the NMF ranker, so
      the domain constraint stays independent of whatever the collaborative
      model has learned.

  - name: item_sodium_mg
    family: item
    dtype: float64
    transform: item_sodium_mg
    fit_on: catalogue
    point_in_time: false
    params:
      fallback: 0.0
    fill:
      unknown_item: 0.0
    rationale: >
      Sodium content in milligrams, passed through from the catalogue.
      Together with calories it is the minimal nutrition signal the
      post-filter needs to enforce hard dietary constraints on the ranked
      candidate list.
